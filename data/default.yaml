# Rime default settings
# encoding: utf-8
#
# NOTE (TriFecta Windows port): this default.yaml carries the macOS-side fix
# documented in the port reference. Two things changed vs. the stock Rime
# default:
#   1. The `uppercase` recognizer pattern is REMOVED. It caused "hold Shift to
#      type capitals then switch back to Chinese" to get stuck in English mode.
#   2. Shift_L and Shift_R are both `inline_ascii`, so holding Shift produces a
#      temporary uppercase that auto-reverts to Chinese on release, while a
#      quick tap of Shift toggles Chinese/English.

config_version: '0.50'

schema_list:
  - schema: luna_pinyin_simp
  - schema: luna_pinyin
  - schema: bopomofo
  - schema: cangjie5
  - schema: stroke
  - schema: terra_pinyin

switcher:
  caption: 〔方案選單〕
  hotkeys:
    - Control+grave
    - Control+Shift+grave
    - F4
  save_options:
    - full_shape
    - ascii_punct
    - simplification
    - extended_charset
    - zh_hant
    - zh_hans
    - zh_hant_tw
  fold_options: true
  abbreviate_options: true
  option_list_separator: '／'

menu:
  page_size: 5

punctuator:
  full_shape:
    __include: punctuation:/full_shape
  half_shape:
    __include: punctuation:/half_shape

key_binder:
  bindings:
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/paging_with_minus_equal
      - key_bindings:/paging_with_comma_period
      - key_bindings:/numbered_mode_switch

selector:
  __patch:
    bindings:
      __include: key_bindings:/rotate_candidate_with_tab
    linear/bindings:
      __include: key_bindings:/rotate_candidate_with_tab
    vertical/bindings:
      __include: key_bindings:/rotate_candidate_with_tab
    vertical/linear/bindings:
      __include: key_bindings:/rotate_candidate_with_tab

recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    # uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"   <-- REMOVED (see note above)
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: inline_ascii
    Shift_R: inline_ascii
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear
